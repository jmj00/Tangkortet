<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f6f78" />
    <!-- Not launched yet: keep it out of search engines (see public/robots.txt). -->
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preload" as="fetch" href="/data/manifest.json" crossorigin />
    <meta
      name="description"
      content="Kort over tang langs de danske kyster – hvor arterne er fundet, og hvilke mulige forureningskilder der ligger i nærheden."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Tangkortet" />
    <title>Tangkortet</title>
  </head>
  <body>
    <div id="app" data-tab="arter">
      <!-- Decides before the first paint whether the start screen shows: not
           with ?kort, not for a shared link with a (valid) pin or a species,
           and on a reload as the history entry was. Not at all in a browser
           without module scripts, where the app itself cannot run. Mirrors
           shouldShowStart in src/startstate.ts (and hash.ts's checks), which
           has the final word once the app has loaded. -->
      <script>
        (function () {
          if (!("noModule" in HTMLScriptElement.prototype)) return;
          if (/[?&]kort(?:[=&]|$)/.test(location.search)) return;
          var show = true;
          var nav = history.state;
          if (nav && nav.tgk === 1 && nav.stack && nav.stack.length) {
            var top = nav.stack[nav.stack.length - 1];
            show = !!(top && top.start);
          } else {
            var params = new URLSearchParams(location.hash.replace(/^#/, ""));
            var pin = /^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(params.get("pin") || "");
            var lat = pin ? Number(pin[1]) : 0;
            var lon = pin ? Number(pin[2]) : 0;
            var validPin = pin && lat > 54 && lat < 58.5 && lon > 7.5 && lon < 15.5;
            var art = /^[a-z-]+$/.test(params.get("art") || "");
            show = !validPin && !art;
          }
          if (show) document.getElementById("app").setAttribute("data-start", "home");
        })();
      </script>
      <h1 class="sr-only">Tangkortet – tang langs de danske kyster</h1>
      <!-- The start screen ("forside"): a layer over the same page, shown on
           every visit without a shared link and from the "Forside" button.
           Behaviour in src/start.ts, styles in src/start.css. The home view is
           static so it paints with the page; the expert's welcome text and
           the safety line are filled in from src/welcome.ts, and the two
           steps are built when they are first opened. -->
      <section id="start" aria-labelledby="start-title">
        <!-- Phone: a pill over the band of map. Sidebar: its top row. -->
        <div class="start__brand" aria-hidden="true">
          <svg class="start__mark" viewBox="12 10 40 40" focusable="false">
            <path class="start__mark-wave" d="M8 46c6-4 10-4 16 0s10 4 16 0 10-4 16 0" />
            <path d="M32 44C26 34 38 26 31 14M32 44c6-8 0-14 6-22" />
          </svg>
          <span class="start__wordmark">Tangkortet</span>
          <span class="start__tag">Tang langs de danske kyster</span>
        </div>
        <div class="start__sheet">
          <div class="start__scroll">
            <div class="start__view" data-view="home">
              <header class="start__head">
                <h2 class="start__title" id="start-title" tabindex="-1">Hvor vil du begynde?</h2>
                <div class="start__intro" id="start-intro"></div>
              </header>
              <!-- In the expert's order of priority: contamination risk first. -->
              <ul class="start__flows" role="list">
                <li class="start__flow">
                  <button type="button" class="flow flow--hero" data-flow="risk">
                    <span class="flow__text">
                      <span class="flow__title">Kan jeg sanke her?</span>
                      <span class="flow__sub"
                        >Vælg et sted, og se mulige forureningskilder, nedbør og vind omkring
                        det.</span
                      >
                    </span>
                    <svg class="flow__art" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
                      <circle class="flow__ring" cx="48" cy="58" r="40" />
                      <circle class="flow__ring" cx="48" cy="58" r="26" />
                      <circle class="flow__ring flow__ring--inner" cx="48" cy="58" r="13" />
                      <path
                        class="flow__pin"
                        d="M48 60s-14-12.5-14-24a14 14 0 0 1 28 0c0 11.5-14 24-14 24z"
                      />
                      <circle class="flow__pin-eye" cx="48" cy="35.5" r="5" />
                    </svg>
                  </button>
                </li>
                <li class="start__flow">
                  <button type="button" class="flow" data-flow="species">
                    <span class="flow__icon flow__icon--dots" aria-hidden="true">
                      <span class="spp-dot" data-group="brunalge"></span>
                      <span class="spp-dot" data-group="rødalge"></span>
                      <span class="spp-dot" data-group="grønalge"></span>
                    </span>
                    <span class="flow__text">
                      <span class="flow__title">Hvor gror …?</span>
                      <span class="flow__sub"
                        >Vælg en art, og se, hvor den er fundet – fastsiddende eller skyllet
                        op.</span
                      >
                    </span>
                  </button>
                </li>
                <li class="start__flow">
                  <button type="button" class="flow" data-flow="beach">
                    <span class="flow__icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" focusable="false">
                        <path
                          d="M2.5 15c1.6 0 1.6-1.5 3.2-1.5s1.6 1.5 3.2 1.5 1.6-1.5 3.1-1.5 1.6 1.5 3.2 1.5 1.6-1.5 3.2-1.5 1.5 1.5 3.1 1.5M2.5 19.5c1.6 0 1.6-1.5 3.2-1.5s1.6 1.5 3.2 1.5 1.6-1.5 3.1-1.5 1.6 1.5 3.2 1.5 1.6-1.5 3.2-1.5 1.5 1.5 3.1 1.5"
                        />
                        <circle cx="16.5" cy="6.5" r="2.5" />
                      </svg>
                    </span>
                    <span class="flow__text">
                      <span class="flow__title">Find en strand</span>
                      <span class="flow__sub"
                        >Søg en by eller strand, og se, hvilke arter der er fundet i nærheden.</span
                      >
                    </span>
                  </button>
                </li>
              </ul>
              <!-- Shown where the map is live beside the start screen (sidebar). -->
              <p class="start__maphint" role="status">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2z" />
                  <path d="M9 4.5v13M15 6.5v13" />
                </svg>
                <span id="start-maphint-text"
                  >Eller zoom ind, og klik på kysten for at se mulige risici dér.</span
                >
              </p>
              <!-- A link, so it works even if the app's script never runs. -->
              <a href="?kort" class="start__skip" data-flow="map">
                <span>Gå til kortet</span>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </a>
              <div class="start__welcome" id="start-welcome"></div>
            </div>
            <div class="start__view" data-view="place" hidden></div>
            <div class="start__view" data-view="species" hidden></div>
          </div>
          <!-- Pinned under the views, so it never scrolls out of sight. -->
          <div class="start__safety">
            <svg class="start__safety-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5l9.5 16.5h-19z" />
              <path d="M12 10v4.5" />
              <circle cx="12" cy="17.2" r="0.6" />
            </svg>
            <p id="start-disclaimer" class="start__disclaimer"></p>
            <!-- Short screens and large text (start.ts sets data-compact): the
                 same verbatim line cut to one line, which opens in full. -->
            <button
              type="button"
              class="start__disclaimer-toggle"
              id="start-disclaimer-toggle"
              aria-expanded="false"
            ></button>
            <button type="button" class="start__guide" data-flow="guide">
              Før du går<span class="start__guide-more">: tjekliste</span>
            </button>
          </div>
        </div>
      </section>
      <!-- Place search (placesearch.ts): shown once wired up, so a page whose
           script fails never offers a field that does nothing. -->
      <form id="search" role="search" autocomplete="off" hidden>
        <input
          id="q"
          type="search"
          enterkeyhint="search"
          spellcheck="false"
          placeholder="Søg by, postnummer eller strand…"
          aria-label="Søg by, postnummer eller strand"
          role="combobox"
          aria-expanded="false"
          aria-controls="results"
          aria-autocomplete="list"
          aria-describedby="search-status"
        />
        <ul id="results" role="listbox" aria-label="Forslag til byer og strande"></ul>
        <div id="search-status" class="search-status is-empty" role="status">
          <span class="search-status__text"></span>
          <button type="button" class="search-status__retry" hidden>Prøv igen</button>
        </div>
      </form>
      <div id="map"></div>
      <!-- A message over the map (the locate button: refused, or no fix). The
           status line is always rendered, so its text is announced; the box
           shows only with data-open (main.ts showMapStatus). -->
      <div id="map-status">
        <p class="map-status__text" role="status"></p>
        <button type="button" class="map-status__close" aria-label="Luk besked" hidden>×</button>
      </div>
      <!-- The sheet (phone) / sidebar (desktop): everything that is not the
           map. Behaviour in src/sheet.ts, layout in src/style.css. -->
      <aside id="panel" aria-label="Arter, risiko og tjekliste">
        <div id="sheet-header">
          <button id="sheet-handle" type="button" aria-controls="sheet-body"></button>
          <!-- The wordmark is the way back to the start screen (start.ts):
               the sidebar's top row, a "Forside" pill in the phone sheet. -->
          <button id="brand" type="button" data-home aria-label="Forside – Tangkortet">
            <!-- the two strands and the wave of public/favicon.svg -->
            <svg class="brand-mark" viewBox="12 10 40 40" aria-hidden="true" focusable="false">
              <path class="brand-mark__wave" d="M8 46c6-4 10-4 16 0s10 4 16 0 10-4 16 0" />
              <path d="M32 44C26 34 38 26 31 14M32 44c6-8 0-14 6-22" />
            </svg>
            <span class="brand-name" aria-hidden="true">Tangkortet</span>
            <span class="brand-home" aria-hidden="true">Forside</span>
          </button>
          <div id="readout">Tryk på kortet ved kysten for at sætte en nål.</div>
          <nav id="tabs" role="tablist" aria-label="Visning">
            <button
              type="button"
              role="tab"
              id="tabbtn-arter"
              data-tab="arter"
              aria-controls="tab-arter"
              aria-selected="true"
            >
              Arter
            </button>
            <button
              type="button"
              role="tab"
              id="tabbtn-risiko"
              data-tab="risiko"
              aria-controls="tab-risiko"
              aria-selected="false"
              tabindex="-1"
            >
              Risiko
            </button>
            <button
              type="button"
              role="tab"
              id="tabbtn-guide"
              data-tab="guide"
              aria-controls="tab-guide"
              aria-selected="false"
              tabindex="-1"
            >
              Før du går
            </button>
          </nav>
        </div>
        <div id="sheet-body">
          <section
            id="tab-arter"
            class="tab"
            role="tabpanel"
            aria-labelledby="tabbtn-arter"
            tabindex="-1"
          >
            Indlæser…
          </section>
          <section
            id="tab-risiko"
            class="tab"
            role="tabpanel"
            aria-labelledby="tabbtn-risiko"
            tabindex="-1"
            hidden
          ></section>
          <section
            id="tab-guide"
            class="tab"
            role="tabpanel"
            aria-labelledby="tabbtn-guide"
            tabindex="-1"
            hidden
          ></section>
          <footer>
            <button id="about" type="button" class="link">Om Tangkortet og data</button>
          </footer>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
