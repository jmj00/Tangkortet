name: deploy

# Rebuilds the payload from the live sources and publishes web/dist to the
# Cloudflare Pages project "tangkortet" (separate from Svampekortet's).
# Manual only until launch: the repo owner decides when the app goes online
# (CLAUDE.md). The site carries noindex + robots "Disallow: /" until then.
#
# Needs the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as
# deploy-review.yml. Optional: VITE_DATAFORDELER_API_KEY (Tangkortet's own key)
# for the Skærmkort basemap and address search, and DATAFORDELER_CLIENT_ID /
# DATAFORDELER_CLIENT_SECRET (Tangkortet's own IT system) for the official
# coastal place names.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      # The coast cells come from Geofabrik's OpenStreetMap extract for
      # Denmark (~500 MB, ODbL), downloaded once per ISO week and kept in the
      # Actions cache; with a warm cache the coast adds about half a minute.
      # Geofabrik down: last week's cached extract is used (restore-keys);
      # with no extract at all the build keeps the committed coast index
      # (the dev sample), and the app shows "Kysten her" only inside it.
      - name: Week of the OpenStreetMap extract
        id: osm-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the OpenStreetMap extract
        id: osm-cache
        uses: actions/cache/restore@v4
        with:
          path: build/osm/denmark-latest.osm.pbf
          key: osm-denmark-${{ steps.osm-week.outputs.week }}
          restore-keys: osm-denmark-
      - name: Download this week's OpenStreetMap extract (Geofabrik)
        id: osm-download
        if: steps.osm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: scripts/fetch_osm_extract.sh build/osm/denmark-latest.osm.pbf
      - name: Save the OpenStreetMap extract
        if: steps.osm-download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/osm/denmark-latest.osm.pbf
          key: osm-denmark-${{ steps.osm-week.outputs.week }}

      # Official coastal place names (Danske Stednavne, Klimadatastyrelsen,
      # CC BY 4.0) need Tangkortet's own Datafordeler IT system; the secrets
      # reach only the fetch step. The register has been frozen since 2025-09,
      # so the fetched file is cached per month and any older month's file is
      # used when this month's fetch fails. No secrets, a failing service and
      # no cached file at all: the build keeps the committed names index (the
      # dev sample), so the official names show only inside it.
      - name: Month of the place names
        id: sn-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the place names
        id: sn-cache
        uses: actions/cache/restore@v4
        with:
          path: build/stednavne/stednavne.json
          key: stednavne-v2-${{ steps.sn-month.outputs.month }}
          restore-keys: stednavne-v2-
      - name: Fetch the place names (Danske Stednavne)
        id: sn-fetch
        if: steps.sn-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          DATAFORDELER_CLIENT_ID: ${{ secrets.DATAFORDELER_CLIENT_ID }}
          DATAFORDELER_CLIENT_SECRET: ${{ secrets.DATAFORDELER_CLIENT_SECRET }}
        run: |
          if [ -z "$DATAFORDELER_CLIENT_ID" ] || [ -z "$DATAFORDELER_CLIENT_SECRET" ]; then
            echo "::warning::No Datafordeler secrets; keeping the cached or committed place names"
            exit 0
          fi
          pbf=build/osm/denmark-latest.osm.pbf
          if [ -s "$pbf" ]; then
            python -m pipeline.ingest.stednavne --coast-pbf "$pbf"
          else
            python -m pipeline.ingest.stednavne
          fi
          echo "fetched=true" >> "$GITHUB_OUTPUT"
      - name: Warn when the place names could not be fetched
        if: steps.sn-fetch.outcome == 'failure'
        run: echo "::warning::Danske Stednavne failed; keeping the cached or committed place names"
      - name: Save the place names
        if: steps.sn-fetch.outputs.fetched == 'true'
        uses: actions/cache/save@v4
        with:
          path: build/stednavne/stednavne.json
          key: stednavne-v2-${{ steps.sn-month.outputs.month }}

      - name: Build the payload (GBIF + MiljøGIS + OpenStreetMap coast + Stednavne)
        run: |
          pbf=build/osm/denmark-latest.osm.pbf
          names=build/stednavne/stednavne.json
          args=(--out web/public/data)
          if [ -s "$pbf" ]; then
            args+=(--coast "$pbf")
          else
            echo "::warning::No OpenStreetMap extract; keeping the committed coast index"
          fi
          if [ -s "$names" ]; then
            args+=(--names "$names")
          else
            echo "::warning::No place names file; keeping the committed names index"
          fi
          python -m pipeline.build "${args[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_DATAFORDELER_API_KEY: ${{ secrets.VITE_DATAFORDELER_API_KEY }}
          VITE_RELEASE: ${{ github.sha }}

      - name: Create the Pages project (first run only)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create tangkortet --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=tangkortet --branch=main
